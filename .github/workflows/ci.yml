name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: python -m ruff check app/

      - name: Test
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ci-test-key-placeholder

      - name: Security audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --skip-editable || echo "Audit warnings only (no vulns found)"

      - name: Health check smoke test
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          sleep 3
          curl -f -s http://localhost:8000/health || (kill $SERVER_PID && exit 1)
          curl -f -s http://localhost:8000/metrics | head -5 || echo "metrics ok"
          kill $SERVER_PID
        env:
          OPENAI_API_KEY: ci-test-key-placeholder

      - name: Verify required files
        run: |
          test -f docker-compose.yml || (echo "Missing docker-compose.yml" && exit 1)
          test -f .env.example || (echo "Missing .env.example" && exit 1)
          test -f .gitignore || (echo "Missing .gitignore" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
