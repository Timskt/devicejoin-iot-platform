[project]
name = "devicejoin-iot"
version = "0.1.0"
description = "AI-powered IoT platform - simplify device onboarding and management"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "openai>=1.58.1",
    "tiktoken>=0.8.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.19",
    "pillow>=11.1.0",
    "pgvector>=0.3.6",
    "redis>=5.2.1",
    "websockets>=14.1",
    "httpx>=0.28.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=24.1.0",
    "celery>=5.4.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.8.6",
    "aiosqlite>=0.20.0",
    "mypy>=1.14.0",
    "types-python-jose>=3.3.0.0",
    "types-passlib>=1.7.7",
    "types-aiofiles>=24.1.0",
    "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E402", "E501", "W293", "UP045"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing -W ignore::UserWarning"
